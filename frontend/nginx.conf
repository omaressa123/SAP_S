server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Digital Twin (Babylon.js 3D app) served at /twin ---
    # Static assets built with base="/twin/" so all /twin/assets/* requests
    # resolve here. Fallback to /twin/index.html for SPA routing.
    location /twin/ {
        alias /usr/share/nginx/html/twin/;
        try_files $uri $uri/ /twin/index.html;
    }
    location /twin/assets/ {
        alias /usr/share/nginx/html/twin/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy the twin's REST + WebSocket API to the twin backend (port 8100).
    # The twin web-client calls root-relative /api/twin/* and /ws/twin, so these
    # are proxied to the twin service (same origin from the iframe's perspective).
    location /api/twin/ {
        proxy_pass http://twin:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/twin {
        proxy_pass http://twin:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /ws/twin {
        proxy_pass http://twin:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # React Router (SPA) fallback for the main dashboard.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (main dashboard).
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
