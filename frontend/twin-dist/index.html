<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Airport Digital Twin</title>
<style>
:root{--bg:#0f1720;--pane:#17212bee;--line:#2a3846;--text:#e6edf3;--mute:#8b9bab;--accent:#38bdf8}
html,body,#root{height:100%;margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
canvas{width:100%;height:100%;display:block;outline:none}
.side,.panel,.bottombar,.topbar,.minimap{position:absolute;background:var(--pane);border:1px solid var(--line);border-radius:8px;padding:12px;backdrop-filter:blur(4px)}
.topbar{left:12px;right:12px;top:12px;display:flex;gap:16px;align-items:center;padding:8px 14px}
.topbar .ok{color:#22c55e}.topbar .warn{color:#eab308}
.side{left:12px;top:64px;width:250px;max-height:calc(100% - 220px);overflow:auto}
.panel{right:12px;top:64px;width:300px;max-height:calc(100% - 220px);overflow:auto}
.minimap{right:12px;bottom:64px;padding:8px}
.minimap canvas{width:220px;height:190px;cursor:pointer}
.bottombar{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;max-width:96vw;overflow-x:auto}
.side button{display:flex;justify-content:space-between;gap:8px;width:100%;margin:2px 0;padding:6px 8px;background:none;color:inherit;border:1px solid transparent;border-radius:4px;cursor:pointer;text-align:left}
.side button:hover,.side button.on{border-color:var(--line);background:#1e2b38}
.bottombar button{padding:5px 9px;background:#1e2b38;color:inherit;border:1px solid var(--line);border-radius:4px;cursor:pointer;white-space:nowrap}
.bottombar button.on{border-color:var(--accent);color:var(--accent)}
.btn{margin:6px 6px 0 0;padding:5px 9px;background:#1e2b38;color:inherit;border:1px solid var(--line);border-radius:4px;cursor:pointer}
.btn:focus-visible,.side button:focus-visible,.bottombar button:focus-visible{outline:2px solid #60a5fa}
.search{width:100%;box-sizing:border-box;margin:6px 0;padding:6px 8px;background:#0f1720;color:inherit;border:1px solid var(--line);border-radius:4px}
.mute{color:var(--mute)} h3{margin:0 0 2px} dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:10px 0}dd{margin:0}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);color:var(--mute);background:#0f1720cc;padding:4px 10px;border-radius:4px;pointer-events:none}
