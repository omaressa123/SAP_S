# Smart Airport Mosquitto broker (development).
# Topic convention: airport/{module}/{device_id}/{event} (see IOT/docs/mqtt-topics.md).
# For production: disable anonymous access, enable password_file / TLS.
listener 1883
protocol mqtt
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
