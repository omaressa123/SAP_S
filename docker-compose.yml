# Smart Green Airport — full development & production environment.
#   docker compose up --build     # start everything (Postgres, backend,
#                                 # frontend, and all AI model services)
#   docker compose down           # stop (Postgres data kept in postgres_data volume)
#   docker compose down -v        # DESTRUCTIVE: deletes the Postgres volume
#
# URL map (host):
#   Frontend:          http://localhost        (port 80)
#   Backend API:       http://localhost:8000   (Health: /health, Docs: /docs)
#   AI Face Reco:      http://localhost:8001/health
#   AI BTD (X-Ray):    http://localhost:8002/health
#   AI Unified Detect: http://localhost:8004/health
#   Postgres:          localhost:5432
name: smart-airport

networks:
  airport-network:
    name: airport-network
    driver: bridge

volumes:
  postgres_data:
    name: smart-airport-postgres-data

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-smart_airport}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-smart_airport}}
  SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-secret}
  API_KEY: ${API_KEY:-MOCK_API_KEY_123}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5173}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  FACE_RECO_URL: http://face-reco:8001
  BTD_URL: http://btd:8002
  BTD_INFERENCE_URL: http://btd:8002
  FULL_DETECTION_URL: http://unified-detection:8004

services:
  postgres:
    image: postgres:18
    container_name: smart-airport-postgres
    restart: unless-stopped
    networks: [airport-network]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_airport}
      POSTGRES_USER: ${POSTGRES_USER:-smart_airport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smart_airport} -d ${POSTGRES_DB:-smart_airport}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-airport-backend
    restart: unless-stopped
    networks: [airport-network]
    environment: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/backend/app
      - ./backend/models:/app/backend/models
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  face-reco:
    build:
      context: ./AI/face_reco
      dockerfile: Dockerfile
    container_name: smart-airport-face-reco
    restart: unless-stopped
    networks: [airport-network]
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5

  btd:
    build:
      context: ./AI/BTD
      dockerfile: Dockerfile
    container_name: smart-airport-btd
    restart: unless-stopped
    networks: [airport-network]
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  unified-detection:
    build:
      context: ./AI
      dockerfile: unified_detection/Dockerfile
    container_name: smart-airport-unified-detection
    restart: unless-stopped
    networks: [airport-network]
    environment:
      - BACKEND_URL=http://backend:8000
      - STARTUP_BACKEND_URL=http://backend:8000
    ports:
      - "8004:8004"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: smart-airport-frontend
    restart: unless-stopped
    networks: [airport-network]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
